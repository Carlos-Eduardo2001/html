<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cabecalho">
    <h1>Formulário</h1>
    <h2>Preencha os campos abaixo</h2>

</div>   
<div class="formulario">
<form action="" method="POST">       <POST / GET-->

<div class="campo">
    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" name="nome" placeholder="Digite o nome Completo do usuário" size="26" required>
</div>

<div class="campo">
    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade onde reside o usuário" size="28" required>
</div>

<div class="campo">
    <label for="email">E-mail:</label>
    <input type="text" id="email" name="email" placeholder="Digite o email do usuário" size="17" required>
</div>

<div class="campo">
    <label for="senha">Senha de Acesso:</label>
    <input type="password" id="senha" name="senha" placeholder="Digite a senha do usuário" size="18" required>
</div>

<div class="campo">
    <label for="data">Data de Nascimento:</label>
    <input type="date" id="data" name="data" placeholder="Digite data de Nascimento do usuário" size="18" required>
</div>

<div class="campo">
    <label for="telefone">Telefone de Contato:</label>
    <input type="tell" id="telefone" name="telefone" placeholder="(##) ####-####" size="9" required>
</div>

<div class="campo">
    <label for="estado">Estado:</label>
    <select id="estado" name="estado" required>
        <option>Rio de Janeiro</option>
        <option>São Paulo</option>
        <option>Minas Gerais</option>
        <option>Ceará</option>
    </select>
</div>


<div class="campo">
    <label class="titulo-campo">Turno de preferência:</label>
    <label class="opcao">
        <input type="radio" name="turno" value="manha"> Manhã
    </label>
    <label class="opcao">
        <input type="radio" name="turno" value="tarde"> Tarde
    </label>
    <label class="opcao">
        <input type="radio" name="turno" value="noite"> Noite
    </label>
</div>


<div class="campo">
    <label class="titulo-campo">Áreas de Interesse:</label>
    <label class="opcao">
        <input type="checkbox" name="interesses" value="tecnologia"> Tecnologia
    </label>
    <label class="opcao">
        <input type="checkbox" name="interesses" value="design"> Design
    </label>
    <label class="opcao">
        <input type="checkbox" name="interesses" value="marketing"> Marketing
    </label>
</div>

<div class="campo">
     <label for="obs">Observações</label>
     <textarea id="obs" name="obs" rows="4" placeholder="Escreva aqui seu comentário..">

     </textarea>
</div>
<div class="campo">
<label for="imagem">Escolha uma imagem:</label>
    <input type="file" id="imagem" name="imagem" accept="image/png, image/jpeg*" required>
</div>

<div class="botao">
   <button class="button" type="submit">Enviar</button>


</div>
 
</div>
</form>














</body>
</html>
